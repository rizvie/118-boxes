name: Boxes118
options:
  bundleIdPrefix: io.riz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # Target and Swift module name. NOT "118Boxes": a Swift module name cannot
  # start with a digit. The user only ever sees CFBundleDisplayName below.
  Boxes118:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.riz.boxes118
        INFOPLIST_KEY_CFBundleDisplayName: 118 Boxes
        DEVELOPMENT_TEAM: 277KG99U9C
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPad gets all four orientations. A six-year-old holds a tablet
        # whichever way it lands, and refusing to rotate reads as a bug.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # 1,2 = iPhone and iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
